# build.toml — конфигурация сборки .exe через PyInstaller

[pyinstaller]
# Основной скрипт с GUI
script = "ui.py"

# Имя итогового .exe (может содержать кириллицу — Windows поддерживает)
name = "1C_to_CK-11"

# Данные для включения в сборку (аналог --add-data)
[[pyinstaller.datas]]
src = "modules"
dest = "modules"

[[pyinstaller.datas]]
src = "config.json"
dest = "."

# Скрытые импорты (аналог --hidden-import)
pyinstaller.hiddenimports = [
    "main",
    "modules.hierarchy_parser",
    "modules.xml_generator",
    "modules.config_manager",
    "modules.file_manager",
    "modules.logger_manager"
]

# Пути поиска модулей (аналог --paths) — не требуются, если структура стандартная
# pyinstaller.paths = []

# Дополнительные флаги
pyinstaller.noconsole = true
pyinstaller.onefile = true
pyinstaller.upx = true